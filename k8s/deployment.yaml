apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-os-backend
  labels:
    app: agency-os-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agency-os-backend
  template:
    metadata:
      labels:
        app: agency-os-backend
    spec:
      containers:
      - name: backend
        image: localhost:5000/agency-os-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: DATABASE_URL
          value: "postgresql://agency_admin:secure_db_password@postgres-service:5432/agency_os"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: MINIO_ENDPOINT
          value: "minio-service"
        - name: OLLAMA_URL
          value: "http://ollama-service:11434"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: agency-os-backend
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-os-frontend
  labels:
    app: agency-os-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agency-os-frontend
  template:
    metadata:
      labels:
        app: agency-os-frontend
    spec:
      containers:
      - name: frontend
        image: localhost:5000/agency-os-frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:3001/api/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: agency-os-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
