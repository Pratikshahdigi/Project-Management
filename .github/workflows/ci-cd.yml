name: Agency OS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-size: 18
        cache: 'npm'
        cache-dependency-path: 'backend/package-lock.json'

    - name: Install Dependencies
      run: |
        cd backend
        npm ci

    - name: Check Formatting & Types
      run: |
        cd backend
        npm run build

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-size: 18
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint and Build
      run: |
        cd frontend
        npm run build
